<body>
<main class="tela tela--passo">
  <div class="tela__conteudo">
    <header class="cabecalho"><a class="voltar" href="14-proposta.html"><svg class="icone" aria-hidden="true"><use href="../../assets/icones/phosphor.svg#i-caret-left"/></svg>Voltar</a></header>
    <div class="passo" data-passo="15"><span class="progresso" role="img" aria-label="Passo 15 de 16"><span class="progresso__feito" style="width: 94%"></span></span><span class="passo__numero">15 de 16</span></div>
    <h1>Para guardar o que você fez, qual é o seu e-mail?</h1>
    <div class="campo campo--erro">
      <label class="campo__rotulo" for="email">E-mail</label><span class="campo__ajuda" id="email-ajuda">Mandamos um código para entrar. Sem senha.</span>
      <input class="campo__entrada" id="email" type="email" inputmode="email" value="ana@exemplo" aria-describedby="email-ajuda email-erro" aria-invalid="true" autocomplete="email">
      <span class="campo__erro" id="email-erro"><svg class="icone icone--pequeno" aria-hidden="true"><use href="../../assets/icones/phosphor.svg#i-warning-circle"/></svg>Confira o e-mail: falta o @ ou o ponto.</span>
    </div>
    <p class="texto-2">Até aqui, nada saiu do seu aparelho.</p>
  </div>
  <div class="acao-fixa acao-fixa--sozinha">
    <a class="botao botao--principal" href="15-email-erro.html" data-precisa="email">Mandar código</a>
  </div>
